name: VibeCode Deploy

on:
  push:
    branches: ["claude/awesome-pasteur-5jyxuc"]
    paths: [".github/workflows/vibecode-deploy.yml", "MODE"]

jobs:
  vibecode:
    runs-on: ubuntu-latest
    env:
      VIBE_KEY: vibe_api_lLXGQ0RzCvaKneMGQKhWd55yaUvavh7t_ade720
      VIBE_URL: https://vibecode.bitrix24.tech
      SERVER_ID: 70ed234d-6089-4675-bfbd-6ac46e147fa9
      APP_URL: https://app-32d5d6bc447f.vibecode.bitrix24.tech
    steps:
      - uses: actions/checkout@v4

      - name: Read mode
        id: mode
        run: echo "mode=$(cat MODE 2>/dev/null || echo probe)" >> "$GITHUB_OUTPUT"

      - name: Probe API
        if: ${{ steps.mode.outputs.mode == 'probe' }}
        run: |
          set +e
          echo "=== infra docs markdown ==="
          curl -sSL -m 20 "$VIBE_URL/docs-content/infra.md" -o /tmp/infra.md
          wc -c /tmp/infra.md; head -c 12000 /tmp/infra.md; echo
          echo "=== openapi infra paths ==="
          curl -sS -m 30 -H "Authorization: Bearer $VIBE_KEY" "$VIBE_URL/v1/openapi.json" -o /tmp/oa.json
          jq -r '.paths | to_entries[] | select(.key | test("infra")) | .key as $p | .value | to_entries[] | "\(.value.operationId // "?") \(.key | ascii_upcase) \($p): \(.value.summary // "")"' /tmp/oa.json
          echo "=== deploy endpoint schema ==="
          jq '.paths | to_entries[] | select(.key | test("deploy")) | .value' /tmp/oa.json | head -c 9000; echo
          echo "=== access-tokens / accessPolicy schema ==="
          jq '.paths | to_entries[] | select(.key | test("access")) | {path: .key, ops: (.value | keys)}' /tmp/oa.json
          jq '.paths | to_entries[] | select(.key | test("access-tokens")) | .value.post.requestBody' /tmp/oa.json | head -c 3000; echo
          echo "=== server PATCH schema (accessPolicy) ==="
          jq '.paths."/v1/infra/servers/{id}".patch.requestBody' /tmp/oa.json | head -c 4000; echo
          true

      - name: Access policy
        if: ${{ steps.mode.outputs.mode == 'access' }}
        run: |
          set +e
          for VAL in '"PORTAL"' '"PORTAL_USERS"' '{"mode":"PORTAL"}' '{"mode":"portal"}' '"portal"'; do
            echo "=== PATCH accessPolicy=$VAL ==="
            curl -sS -m 30 -X PATCH "$VIBE_URL/v1/infra/servers/$SERVER_ID/access-policy" \
              -H "Authorization: Bearer $VIBE_KEY" -H "Content-Type: application/json" \
              -d "{\"accessPolicy\": $VAL}" | head -c 800; echo
          done
          echo "=== server state ==="
          curl -sS -m 30 -H "Authorization: Bearer $VIBE_KEY" "$VIBE_URL/v1/infra/servers/$SERVER_ID" | head -c 1500; echo
          true

      - name: Teardown
        if: ${{ steps.mode.outputs.mode == 'teardown' }}
        run: |
          set +e
          echo "=== find exec endpoint ==="
          curl -sS -m 30 -H "Authorization: Bearer $VIBE_KEY" "$VIBE_URL/v1/openapi.json" -o /tmp/oa.json
          jq -r '.paths | keys[] | select(test("exec|command"))' /tmp/oa.json

          CMD='systemctl stop idea-bank; systemctl disable idea-bank; rm -f /etc/systemd/system/idea-bank.service; systemctl daemon-reload; rm -rf /opt/app; echo TEARDOWN_DONE; systemctl status idea-bank --no-pager | head -3; ls /opt 2>/dev/null'
          for EP in "exec" "execute" "commands" "command"; do
            echo "=== POST $EP ==="
            curl -sS -m 120 -X POST "$VIBE_URL/v1/infra/servers/$SERVER_ID/$EP" \
              -H "Authorization: Bearer $VIBE_KEY" -H "Content-Type: application/json" \
              -d "$(jq -n --arg c "$CMD" '{command: $c, timeout: 60}')" | head -c 3000; echo
          done

          echo "=== lock access to owner only ==="
          curl -sS -m 30 -X PATCH "$VIBE_URL/v1/infra/servers/$SERVER_ID/access-policy" \
            -H "Authorization: Bearer $VIBE_KEY" -H "Content-Type: application/json" \
            -d '{"accessPolicy": "OWNER_ONLY"}' | head -c 500; echo

          echo "=== app url after teardown ==="
          curl -sS -m 20 -o /dev/null -w "%{http_code}\n" "$APP_URL/api/health"
          true

      - name: Deploy
        if: ${{ steps.mode.outputs.mode == 'deploy' }}
        run: |
          set -e
          echo "=== access-policy PATCH schema ==="
          curl -sS -m 30 -H "Authorization: Bearer $VIBE_KEY" "$VIBE_URL/v1/openapi.json" -o /tmp/oa.json
          jq '.paths."/v1/infra/servers/{id}/access-policy".patch.requestBody' /tmp/oa.json

          echo "=== packing sources ==="
          tar czf /tmp/src.tar.gz app templates requirements.txt
          ls -la /tmp/src.tar.gz
          B64=$(base64 -w0 /tmp/src.tar.gz)

          echo "=== deploying ==="
          jq -n --arg b64 "$B64" --arg key "$VIBE_KEY" '{
            source: { content: $b64 },
            extractTo: "/opt/app",
            install: "(apt-get update -qq && apt-get install -y -qq python3-pip python3-venv) || sudo bash -c \"apt-get update -qq && apt-get install -y -qq python3-pip python3-venv\"; cd /opt/app && python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt",
            start: "cd /opt/app && .venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 3000",
            port: 3000,
            env: {
              BITRIX_BASE_URL: "https://vibecode.bitrix24.tech/v1",
              BITRIX_API_KEY: $key
            },
            systemd: true,
            cleanDeploy: true,
            serviceName: "idea-bank"
          }' > /tmp/deploy.json

          HTTP=$(curl -sS -m 600 -o /tmp/deploy_resp.json -w "%{http_code}" \
            -X POST "$VIBE_URL/v1/infra/servers/$SERVER_ID/deploy?stream=false" \
            -H "Authorization: Bearer $VIBE_KEY" \
            -H "Content-Type: application/json" \
            --data @/tmp/deploy.json)
          echo "deploy HTTP=$HTTP"
          cat /tmp/deploy_resp.json | head -c 6000; echo
          jq -e '.success == true' /tmp/deploy_resp.json > /dev/null || { echo "DEPLOY FAILED"; exit 1; }

          echo "=== health check via access token ==="
          TOKEN=$(curl -sS -m 30 -X POST "$VIBE_URL/v1/infra/servers/$SERVER_ID/access-tokens" \
            -H "Authorization: Bearer $VIBE_KEY" -H "Content-Type: application/json" \
            -d '{"mode":"api-bearer","ttlSeconds":3600,"name":"ci-health"}' | jq -r '.data.token // .data.jwt // empty')
          if [ -n "$TOKEN" ]; then
            sleep 5
            curl -sS -m 30 -H "Authorization: Bearer $TOKEN" "$APP_URL/api/health"; echo
            echo "=== echo headers seen by app ==="
            curl -sS -m 30 -H "Authorization: Bearer $TOKEN" "$APP_URL/api/echo" | head -c 4000; echo
          else
            echo "no token minted"
          fi

          echo "=== docs: gateway auth / forwarded identity ==="
          set +e
          for P in docs-content/infra.md docs-content/auth.md docs-content/access.md; do
            curl -sSL -m 20 "$VIBE_URL/$P" -o /tmp/doc.md && \
              grep -i -A4 -B2 -E "header|identity|x-forwarded|user|jwt|cookie" /tmp/doc.md | head -c 6000
            echo "---- end $P ----"
          done
          set -e

          echo "=== current access rules ==="
          curl -sS -m 30 -H "Authorization: Bearer $VIBE_KEY" "$VIBE_URL/v1/infra/servers/$SERVER_ID/access" | head -c 2000; echo
          [ "$HTTP" = "200" ]
