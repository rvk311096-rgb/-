name: VibeCode Deploy

on:
  push:
    branches: ["claude/awesome-pasteur-5jyxuc"]
    paths: [".github/workflows/vibecode-deploy.yml", "MODE"]

jobs:
  vibecode:
    runs-on: ubuntu-latest
    env:
      VIBE_KEY: vibe_api_lLXGQ0RzCvaKneMGQKhWd55yaUvavh7t_ade720
      VIBE_URL: https://vibecode.bitrix24.tech
      SERVER_ID: 70ed234d-6089-4675-bfbd-6ac46e147fa9
      APP_URL: https://app-32d5d6bc447f.vibecode.bitrix24.tech
    steps:
      - uses: actions/checkout@v4

      - name: Read mode
        id: mode
        run: echo "mode=$(cat MODE 2>/dev/null || echo probe)" >> "$GITHUB_OUTPUT"

      - name: Probe API
        if: ${{ steps.mode.outputs.mode == 'probe' }}
        run: |
          set +e
          echo "=== infra docs markdown ==="
          curl -sSL -m 20 "$VIBE_URL/docs-content/infra.md" -o /tmp/infra.md
          wc -c /tmp/infra.md; head -c 12000 /tmp/infra.md; echo
          echo "=== openapi infra paths ==="
          curl -sS -m 30 -H "Authorization: Bearer $VIBE_KEY" "$VIBE_URL/v1/openapi.json" -o /tmp/oa.json
          jq -r '.paths | to_entries[] | select(.key | test("infra")) | .key as $p | .value | to_entries[] | "\(.value.operationId // "?") \(.key | ascii_upcase) \($p): \(.value.summary // "")"' /tmp/oa.json
          echo "=== deploy endpoint schema ==="
          jq '.paths | to_entries[] | select(.key | test("deploy")) | .value' /tmp/oa.json | head -c 9000; echo
          echo "=== access-tokens / accessPolicy schema ==="
          jq '.paths | to_entries[] | select(.key | test("access")) | {path: .key, ops: (.value | keys)}' /tmp/oa.json
          jq '.paths | to_entries[] | select(.key | test("access-tokens")) | .value.post.requestBody' /tmp/oa.json | head -c 3000; echo
          echo "=== server PATCH schema (accessPolicy) ==="
          jq '.paths."/v1/infra/servers/{id}".patch.requestBody' /tmp/oa.json | head -c 4000; echo
          true

      - name: Deploy
        if: ${{ steps.mode.outputs.mode == 'deploy' }}
        run: |
          echo "Deploy step placeholder — will be filled after probe reveals the API shape"
